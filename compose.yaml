services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel_local
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - travel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_local"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  travel_postgres_data:
